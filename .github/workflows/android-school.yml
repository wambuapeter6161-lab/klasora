name: Build School System APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'school-system/**'
      - 'school-android/**'
      - 'assets/**'
      - '.github/workflows/android-school.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (School System only)
        run: |
          mkdir -p www assets
          for f in index.html style.css app.js firebase-auth.js manifest.webmanifest klasora-icon.svg klasora.ico klasora-192.png klasora-512.png; do
            cp ../school-system/$f www/
          done
          cp ../assets/icon-only.png ../assets/icon-foreground.png ../assets/icon-background.png assets/

      - name: Add and sync Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: school-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klasora-school-apk
          path: school-android/android/app/build/outputs/apk/debug/app-debug.apk
