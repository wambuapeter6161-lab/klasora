name: Build Super Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'superadmin.*'
      - 'klasora-icon.svg'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-superadmin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (only Super Admin)
        run: |
          mkdir -p www
          cp superadmin.html www/index.html
          cp superadmin.css superadmin.js klasora-icon.svg www/

      - name: Add and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klasora-superadmin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
