name: Publish School System (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'school-system/**'
      - 'superadmin.*'
      - 'klasora-icon.svg'
      - 'assets/**'
      - '.github/workflows/pages-school.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-school
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site (School System + Super Admin)
        run: |
          mkdir -p _site/superadmin
          cp -r school-system/. _site/
          B=${GITHUB_SHA::7}
          sed -i "s/__BUILD__/$B/g" _site/app.js
          echo "{\"v\":\"$B\"}" > _site/version.json
          rm -rf _site/school-desktop
          cp superadmin.js superadmin.css klasora-icon.svg _site/superadmin/
          cp superadmin.html _site/superadmin/index.html
          if [ -d assets ]; then cp -r assets _site/superadmin/assets; fi
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
