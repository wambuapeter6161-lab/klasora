name: Publish School System (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'school-system/**'
      - '.github/workflows/pages-school.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-school
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove files not needed on the web
        run: rm -rf school-system/school-desktop
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./school-system
          publish_branch: gh-pages
          force_orphan: true
